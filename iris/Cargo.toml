[package]
name = "tutor-iris"
description = "A tutor model for the iris data set from hugging face."
version = "0.0.1"
edition = "2024"

[dependencies]
clap = { version = "4.6.8", features = ["derive"] }
ndarray = "0.16"
ndarray-rand = "0.15"
rand = "0.8"
csv = "1"
serde = { version = "1", features = ["derive"] }
linfa = "0.8"
linfa-logistic = "0.8"
anyhow = "1.0.104"
getset = "0.1.7"
typetag = "0.2.23"
postcard = { version = "1.1.3", features = ["alloc"] }
